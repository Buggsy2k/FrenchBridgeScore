<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B12"/>
    </linearGradient>
  </defs>

  <!-- Background: card-table green -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Large red heart centered, slightly smaller -->
  <path d="M256 400
           C256 400 80 250 80 168
           C80 108 120 72 178 72
           C214 72 240 98 256 126
           C272 98 298 72 334 72
           C392 72 432 108 432 168
           C432 250 256 400 256 400Z"
        fill="#D32F2F"/>
  <!-- Heart highlight -->
  <path d="M256 382
           C256 382 98 242 98 168
           C98 118 130 86 178 86
           C210 86 236 108 256 136
           C276 108 302 86 334 86
           C382 86 414 118 414 168
           C414 242 256 382 256 382Z"
        fill="#E53935"/>
  <!-- Heart sheen -->
  <ellipse cx="195" cy="142" rx="40" ry="26" fill="#EF5350" opacity="0.5"/>

  <!-- F - top left -->
  <text x="195" y="230" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="120" font-weight="bold" fill="#000" opacity="0.2" dx="2" dy="2">F</text>
  <text x="195" y="230" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="120" font-weight="bold" fill="#FFFFFF">F</text>

  <!-- B - top right -->
  <text x="317" y="230" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="120" font-weight="bold" fill="#000" opacity="0.2" dx="2" dy="2">B</text>
  <text x="317" y="230" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="120" font-weight="bold" fill="#FFFFFF">B</text>

  <!-- S - bottom center -->
  <text x="256" y="355" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="120" font-weight="bold" fill="#000" opacity="0.2" dx="2" dy="2">S</text>
  <text x="256" y="355" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="120" font-weight="bold" fill="#FFFFFF">S</text>
</svg>
