<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B12"/>
    </linearGradient>
    <linearGradient id="spadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Background: card-table green -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Subtle felt texture lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="#1A5A1E" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#1A5A1E" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#1A5A1E" stroke-width="0.5" opacity="0.3"/>

  <!-- Large spade shape behind text -->
  <path d="M256 80
           C256 80 120 210 120 290
           C120 340 160 370 210 355
           C230 348 248 332 256 310
           C264 332 282 348 302 355
           C352 370 392 340 392 290
           C392 210 256 80 256 80Z"
        fill="url(#spadeGrad)" opacity="0.35"/>
  <!-- Spade stem -->
  <rect x="244" y="310" width="24" height="60" rx="4" fill="#000" opacity="0.35"/>
  <!-- Spade base flourish -->
  <path d="M210 370 Q233 340 256 370 Q279 340 302 370"
        stroke="#000" stroke-width="6" fill="none" opacity="0.35"/>

  <!-- "FB" text - bold white with slight shadow -->
  <text x="256" y="295" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="220" font-weight="bold" letter-spacing="-8">
    <tspan fill="#000" opacity="0.3" dx="3" dy="3">FB</tspan>
  </text>
  <text x="256" y="295" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-size="220" font-weight="bold" fill="#FFFFFF" letter-spacing="-8">FB</text>

  <!-- Score accent: gold tally marks bottom -->
  <g transform="translate(168, 400)" stroke="#FFD54F" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="0" x2="0" y2="36"/>
    <line x1="18" y1="0" x2="18" y2="36"/>
    <line x1="36" y1="0" x2="36" y2="36"/>
    <line x1="54" y1="0" x2="54" y2="36"/>
    <line x1="-6" y1="28" x2="60" y2="6"/>
  </g>
  <!-- Second tally group -->
  <g transform="translate(280, 400)" stroke="#FFD54F" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="0" x2="0" y2="36"/>
    <line x1="18" y1="0" x2="18" y2="36"/>
    <line x1="36" y1="0" x2="36" y2="36"/>
    <line x1="54" y1="0" x2="54" y2="36"/>
    <line x1="-6" y1="28" x2="60" y2="6"/>
  </g>

  <!-- Small decorative spade top-left -->
  <path d="M72 56 C72 56 56 72 56 80 C56 86 62 88 72 84 C82 88 88 86 88 80 C88 72 72 56 72 56Z"
        fill="#FFD54F" opacity="0.6"/>
  <!-- Small decorative spade bottom-right -->
  <path d="M440 456 C440 456 424 472 424 480 C424 486 430 488 440 484 C450 488 456 486 456 480 C456 472 440 456 440 456Z"
        fill="#FFD54F" opacity="0.6"/>
</svg>
